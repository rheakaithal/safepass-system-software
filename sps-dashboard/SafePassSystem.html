<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flood Monitoring Dashboard</title>
    <link rel="stylesheet" href="styles/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Sidebar Navigation -->
        <nav class="sidebar">
            <div class="sidebar-header">
                <img src="images/SPSLogoTransparent.png" alt="SPS Logo" class="sidebar-logo">
            </div>
            
            <div class="sidebar-section-fixed">
                <div class="sidebar-section-title">General</div>
                <button class="sidebar-link active" data-page="Home.html" data-title="Home" data-subtitle="Welcome to the Dashboard">
                    <img src="images/home.png" alt="Home" class="sidebar-icon">
                    <span class="sidebar-text">Home</span>
                </button>
                <button class="sidebar-link" data-page="Settings.html" data-title="Settings" data-subtitle="Configure Your Preferences">
                    <img src="images/edit.png" alt="Settings" class="sidebar-icon">
                    <span class="sidebar-text">Settings</span>
                </button>
                <button class="sidebar-link" data-page="FAQ.html" data-title="FAQ" data-subtitle="Frequently Asked Questions">
                    <img src="images/faq.png" alt="FAQ" class="sidebar-icon">
                    <span class="sidebar-text">FAQ</span>
                </button>
                <button class="sidebar-link" data-page="UserGuide.html" data-title="User Guide" data-subtitle="Complete Dashboard Documentation">
                    <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                         style="width:20px;height:20px;filter:brightness(0) invert(1);">
                        <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
                        <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
                    </svg>
                    <span class="sidebar-text">User Guide</span>
                </button>
            </div>

            <div class="sidebar-section-scroll">
                <div class="sidebar-section-title">Dashboards</div>
                <div class="sidebar-section-scroll-buttons">
                <button class="sidebar-link" data-page="RossStContent.html" data-title="Ross Street" data-subtitle="Real-time Flood Monitoring">
                    <img src="images/SPSLogo.png" alt="Ross St" class="sidebar-icon">
                    <span class="sidebar-text">Ross St</span>
                </button>
                <button class="sidebar-link" data-page="FillerContent.html" data-title="Filler" data-subtitle="Placeholder Dashboard">
                    <img src="images/SPSLogo.png" alt="Filler" class="sidebar-icon">
                    <span class="sidebar-text">Filler</span>
                </button>
                </div>
            </div>
        </nav>

        <!-- Main Content Area -->
        <main class="main-content">
            <!-- Header -->
            <header class="header">
                <h1 class="header-title" id="page-title" contenteditable="true">Home</h1>
                <div class="header-subtitle" id="page-subtitle">Welcome to the Dashboard</div>
            </header>

            <!-- Content Container with iframe -->
            <div class="content-container">
                <iframe id="content-frame" src="Home.html" title="Dashboard Content"></iframe>
            </div>


        </main>
    </div>
    <!-- The parent shell only needs settings (for the diagnostic log interceptor)
         and navigation (to wire the sidebar). All other scripts load inside the iframe. -->
    <script src="scripts/settings.js"></script>
    <script src="scripts/navigation.js"></script>
</body>
</html>
